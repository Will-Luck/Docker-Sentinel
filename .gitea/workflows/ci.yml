name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# The golang image sets GOTOOLCHAIN=local and the runner does not re-pull it,
# so let go.mod's toolchain line choose the Go release.
env:
  GOTOOLCHAIN: auto

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
      network: gitea_default
    steps:
      - name: Install dependencies
        run: apk add --no-cache git make

      - name: Checkout
        run: |
          git clone http://gitea-token:${{ github.token }}@gitea:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Download modules
        run: go mod download

      - name: Bundle frontend
        run: make frontend

      - name: Check bundle is current
        run: git diff --exit-code -- internal/web/static/

      - name: Build
        run: make build

      - name: Test
        run: make test-ci

  lint:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
      network: gitea_default
    steps:
      - name: Install dependencies
        run: apk add --no-cache git make

      - name: Checkout
        run: |
          git clone http://gitea-token:${{ github.token }}@gitea:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          export PATH="$(go env GOPATH)/bin:$PATH"

      - name: Lint
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint

  vulncheck:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
      network: gitea_default
    steps:
      - name: Install dependencies
        run: apk add --no-cache git

      - name: Checkout
        run: |
          git clone http://gitea-token:${{ github.token }}@gitea:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
